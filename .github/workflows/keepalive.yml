name: Supabase Keep-Alive

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Query reports table to reset inactivity timer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/reports?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")
          echo "Supabase REST responded HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Keep-alive failed (HTTP $code). If the project is paused, restore it once in the Supabase dashboard."
            exit 1
          fi
